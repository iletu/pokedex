<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex</title>

    <link rel="icon" type="image/x-icon" href="./assets/icon/pokeball-favicon-32x32.png">

    <link rel="stylesheet" href="./style/variable.css">
    <link rel="stylesheet" href="./style/fonts.css">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/dialog.css">
    <link rel="stylesheet" href="./style/responsive.css">
</head>


<body>

    <header>
        <div class="pokedex-logo">
            <img src="./assets/img/pokeball.png" alt="Pokéball">
            <h1>Pokédex</h1>
        </div>

        <div class="search">
            <input id="search-input" type="text" placeholder="Search Pokémon..." oninput="searchPokemon()">

            <button onclick="searchPokemon()">Search</button>
        </div>
    </header>


    <main>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <img src="./assets/img/pokeball.png" alt="Loading" class="loading-pokeball">

            <p>Loading Pokémon...</p>
        </div>


        <!-- Pokémon Karten -->
        <section id="pokemon-card">
            <!-- Hier werden die Pokémons gerendert -->
        </section>


        <!-- Load More -->
        <button class="load-more-button" onclick="loadMorePokemon()">
            Load more
        </button>


        <!-- Pokémon Dialog -->
        <section>
            <dialog id="myDialog">

                <div id="pokemon-dialog">
                    <!-- Hier wird das angeklickte Pokémon gerendert -->
                </div>

                <button aria-label="Dialog schließen" onclick="closeDialog()">
                    ✕
                </button>

            </dialog>
        </section>

    </main>


    <footer>
        <img src="./assets/img/pokeball.png" alt="Pokéball">
        <p>© 2026 Pokédex</p>
    </footer>


    <!-- JavaScript -->
    <script src="./script/templates.js"></script>
    <script src="./script/script.js"></script>

</body>

</html>
